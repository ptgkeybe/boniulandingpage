<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博牛社区关停公告</title>

<style>
/* ✅ 基礎：避免露底灰色、避免手機自動放大字 */
html, body{
  margin:0;
  padding:0;
  min-height:100svh;
  background:#000;                 /* ✅ 沒載到背景圖時也不會灰 */
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "PingFang SC","PingFang TC",
    "Microsoft YaHei","Microsoft JhengHei",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

/* ✅ 背景：加上 #000 保底（最右邊那個） */
body{
  background:
    linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32)),
    url("./IMG_20251219_164356_210.png") center/cover no-repeat,
    #000;
}

/* ✅ 主容器：一定撐滿螢幕 */
.page{
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:32px 20px;
  box-sizing:border-box;
}

.card{
  width:100%;
  max-width:680px;
  text-align:center;
}

/* LOGO */
.logo{
  width:140px;
  margin:0 auto 18px;
  display:block;
  opacity:.95;
}

/* 標題 */
.title{
  font-size:15px;
  font-weight:600;
  letter-spacing:.12em;
  margin:0 0 20px;
}

/* 內文區 */
.content{
  font-size:13px;
  line-height:2.1;
  opacity:.92;
}

.content p{
  margin:20px 0;
}

/* 落款 */
.footer{
  margin-top:28px;
  font-size:12px;
  line-height:1.9;
  opacity:.85;
}

/* 桌機微調 */
@media (min-width:768px){
  .logo{ width:160px; }
  .title{ font-size:16px; }
  .content{ font-size:14px; }
  .footer{ font-size:13px; }
}
</style>
</head>

<body>
  <div class="page">
    <div class="card">

      <img src="./IMG_20251219_164415_683.png" class="logo" alt="博牛社区">

      <div class="title">博牛社区关停公告</div>

      <div class="content">
        <p>亲爱的博牛社区用户、会员及合作伙伴：</p>

        <p>
          感谢您自 2014 年以来对博牛社区的支持与陪伴。
          基于战略调整，博牛社区将于 2025 年 12 月 31 日起正式停止运营，并同步关闭
          相关服务器及服务功能。在正式关停前，我们将持续做好必要的运营支持与沟
          通工作，确保整体关停流程平稳、有序推进，尽量减少对用户及合作伙伴的影
          响。
        </p>

        <p>
          由衷感谢每一位支持过我们的用户与合作伙伴。
          无论您是一路陪伴至今的老朋友，还是曾在这里短暂停留，我们都心怀感激。
          虽然博牛社区即将画上句号，但这段共同走过的时光，将始终被我们珍视。
        </p>
      </div>

      <div class="footer">
        博牛社区 敬上<br>
        2026 年 1 月 1 日
      </div>

    </div>
  </div>
</body>
</html>
