<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>博牛社区关停公告</title>
  <meta name="description" content="博牛社区关停公告" />

  <style>
    :root{
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.75);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,
      "PingFang TC","PingFang SC",
      "Noto Sans TC","Noto Sans SC",
      "Microsoft JhengHei","Microsoft YaHei",Arial,sans-serif;
      background:#0b0f14;
      color:var(--text);
    }

    .hero{
      min-height:100vh;
      background:
        linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.55)),
        url("IMG_20251219_164356_210.png") center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(20px,4vw,56px);
    }

    .card{
      width:min(860px,100%);
      text-align:center;
      padding:clamp(18px,3.2vw,36px) clamp(14px,3vw,40px);
    }

    .logo{
      width:clamp(90px,10vw,120px);
      margin:0 auto 14px;
      display:block;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    h1{
      margin:8px 0 16px;
      font-size:clamp(18px,2.6vw,24px);
      font-weight:700;
      letter-spacing:.08em;
    }

    .lead{
      margin-bottom:10px;
      font-size:clamp(14px,2.1vw,16px);
      color:var(--muted);
      font-weight:600;
    }

    .content{
      max-width:44em;
      margin:0 auto;
      line-height:1.9;
      font-size:clamp(14px,2.1vw,16px);
    }

    .content p{ margin:10px 0; }

    .sign{
      margin-top:20px;
      color:var(--muted);
      font-size:clamp(13px,2vw,15px);
      line-height:1.8;
    }

    .date{
      margin-top:6px;
      font-weight:700;
      letter-spacing:.06em;
      color:rgba(255,255,255,.88);
    }
  </style>
</head>

<body>
  <main class="hero">
    <section class="card">
      <img src="IMG_20251219_164415_683.png" class="logo" alt="博牛社区 Logo" />

      <h1>博牛社区关停公告</h1>

      <div class="lead">
        亲爱的博牛社区用户、会员及合作伙伴：
      </div>

      <div class="content">
        <p>感谢您自 2014 年以来对博牛社区的支持与陪伴。</p>

        <p>
          基于战略调整，博牛社区将于
          <strong>2025 年 12 月 31 日</strong>
          起正式停止运营，并同步关闭相关服务器及服务功能。
        </p>

        <p>
          在正式关停前，我们将持续做好必要的运营支持与沟通工作，
          确保整体关停流程平稳、有序推进，
          尽量减少对用户及合作伙伴的影响。
        </p>

        <p>
          由衷感谢每一位支持过我们的用户与合作伙伴。
          无论您是一路陪伴至今的老朋友，
          还是曾在这里短暂停留，我们都心怀感激。
        </p>

        <p>
          虽然博牛社区即将画上句号，
          但这段共同走过的时光，将始终被我们珍视。
        </p>
      </div>

      <div class="sign">
        <div>博牛社区 敬上</div>
        <div class="date">2026 年 1 月 1 日</div>
      </div>
    </section>
  </main>
</body>
</html>
