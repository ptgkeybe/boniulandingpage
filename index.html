<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博牛社区关停公告</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:
    -apple-system,BlinkMacSystemFont,
    "PingFang SC","PingFang TC",
    "Microsoft YaHei","Microsoft JhengHei",
    Arial,sans-serif;
}

body{
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("IMG_20251219_164356_210.png") center/cover no-repeat;
  color:#fff;
}

/* 主容器 */
.wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 內容區，整體偏上 */
.content{
  width:90%;
  max-width:720px;
  text-align:center;
  transform: translateY(-4%);
}

/* Logo */
.logo{
  width:110px;
  margin:0 auto 16px;
  display:block;
}

/* 標題 */
h1{
  font-size:16px;
  font-weight:600;
  margin:12px 0 18px;
  letter-spacing:.08em;
}

/* 內文 */
.text{
  font-size:13px;
  line-height:2;
  opacity:.95;
}

.text p{
  margin:12px 0;
}

/* 簽名 */
.footer{
  margin-top:26px;
  font-size:12px;
  opacity:.85;
  line-height:1.8;
}

/* 桌機稍微放大 */
@media (min-width:768px){
  h1{ font-size:18px; }
  .text{ font-size:14px; }
  .logo{ width:130px; }
}
</style>
</head>

<body>
<div class="wrapper">
  <div class="content">

    <img src="IMG_20251219_164415_683.png" class="logo" alt="博牛社区">

    <div class="title">博牛社区关停公告</div>

      <div class="text">
        <p>亲爱的博牛社区用户、会员及合作伙伴：</p>

        <p>
          感谢您自 2014 年以来对博牛社区的支持与陪伴。基于战略调整，博牛社区将于 2025 年 12 月 31 日起正式停止运营，并同步关闭相关服务器及服务功能。在正式关停前，我们将持续做好必要的运营支持与沟通工作，确保整体关停流程平稳、有序推进，尽量减少对用户及合作伙伴的影响。
        </p>

        <p>
          由衷感谢每一位支持过我们的用户与合作伙伴。无论您是一路陪伴至今的老朋友，还是曾在这里短暂停留，我们都心怀感激。虽然博牛社区即将画上句号，但这段共同走过的时光，将始终被我们珍视。
        </p>
      </div>

      <div class="sign">
        博牛社区 敬上<br>
        2026 年 1 月 1 日
      </div>

  </div>
</div>
</body>
</html>
