<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>博牛社区关停公告</title>

<style>
  :root { --vh: 1vh; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000; /* 防止露底變灰 */
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont,
      "PingFang SC","PingFang TC",
      "Microsoft YaHei","Microsoft JhengHei", Arial, sans-serif;
  }

  /* 背景用固定定位，永遠鋪滿整個可視區 */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
      url("IMG_20251219_164356_210.png") center/cover no-repeat;
  }

  /* 用 JS 設定的真實高度，避免 Chrome 露邊 */
  .wrap{
    min-height: calc(var(--vh) * 100);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .panel{
    width: min(720px, 92vw);
    text-align:center;
    transform: translateY(-4%);
  }

  .logo{
    width:110px;
    height:auto;
    display:block;
    margin:0 auto 16px;
  }

  .title{
    font-size:16px;
    font-weight:600;
    letter-spacing:.08em;
    margin:10px 0 18px;
  }

  .text{
    font-size:13px;
    line-height:2;
    opacity:.95;
  }
  .text p{ margin:14px 0; }

  .sign{
    margin-top:26px;
    font-size:12px;
    line-height:1.8;
    opacity:.85;
  }

  @media (min-width:768px){
    .logo{ width:130px; }
    .title{ font-size:18px; }
    .text{ font-size:14px; }
    .sign{ font-size:13px; }
  }
</style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="wrap">
    <div class="panel">
      <img src="IMG_20251219_164415_683.png" class="logo" alt="博牛社区">

      <div class="title">博牛社区关停公告</div>

      <div class="text">
        <p>亲爱的博牛社区用户、会员及合作伙伴：</p>

        <p>
